<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générer mon menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7ee; color: #243018; }
    .navbar-brand, h1 { font-family: Georgia, serif; }
    .meal-card { border-left: 4px solid #729b31; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    function Generator() {
      const [days, setDays] = React.useState([]);
      const [error, setError] = React.useState('');
      const [loading, setLoading] = React.useState(true);

      async function generateMenu() {
        setLoading(true);
        setError('');
        try {
          const response = await fetch('/api/weekly-menus/generate/');
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'La génération a échoué.');
          setDays(data.days);
        } catch (exception) {
          setError(exception.message);
        } finally {
          setLoading(false);
        }
      }

      React.useEffect(() => { generateMenu(); }, []);

      return <>
        <nav className="navbar bg-white shadow-sm px-4 px-md-5 py-3">
          <a className="navbar-brand fs-3 fw-bold text-success" href="/">Menus</a>
          <a className="btn btn-outline-success ms-auto" href="/connexion/">Connexion</a>
        </nav>
        <main className="container py-5">
          <div className="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div><p className="text-uppercase text-success fw-semibold mb-1">Cette semaine</p><h1 className="display-6 fw-bold mb-0">Votre menu</h1></div>
            <button className="btn btn-success px-4" onClick={generateMenu} disabled={loading}>{loading ? 'Génération...' : 'Générer un autre menu'}</button>
          </div>
          {error && <div className="alert alert-danger" role="alert">{error}</div>}
          {loading && !days.length && <p className="text-muted">Préparation de vos repas...</p>}
          <div className="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
            {days.map((day) => <article className="col" key={day.day}><div className="card meal-card h-100 shadow-sm"><div className="card-body"><h2 className="h4 card-title mb-4">{day.day}</h2><p className="text-uppercase small text-success fw-bold mb-1">Midi</p><p className="mb-4">{day.lunch.name}</p><p className="text-uppercase small text-success fw-bold mb-1">Soir</p><p className="mb-0">{day.dinner.name}</p></div></div></article>)}
          </div>
        </main>
      </>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Generator />);
  </script>
</body>
</html>
