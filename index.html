<!DOCTYPE html>
<html lang="fr">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menus - Accueil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7ee; color: #243018; }
    .hero { min-height: calc(100vh - 72px); background: linear-gradient(90deg, rgba(29, 55, 23, .84), rgba(29, 55, 23, .25)), url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1800&q=85') center/cover; }
    .navbar-brand, .hero h1 { font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    function Home() {
      return <>
        <nav className="navbar navbar-expand bg-white shadow-sm px-4 px-md-5 py-3">
          <a className="navbar-brand fs-3 fw-bold text-success" href="/">Menus</a>
          {% if user.is_authenticated %}
          <form className="ms-auto" method="post" action="{% url 'logout' %}"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" /><button className="btn btn-outline-success" type="submit">Se déconnecter</button></form>
          <a className="btn btn-light border p-1 ms-2" href="{% url 'profile' %}" aria-label="Modifier mon profil" title="Modifier mon profil"><img src="{% static 'profile_pictures/' %}{{ profile.avatar }}" alt="Photo de profil de {{ user.username }}" title="Photo de profil de {{ user.username }}" width="40" height="40" className="rounded-circle" /></a>
          {% else %}
          <a className="btn btn-outline-success ms-auto" href="{% url 'login' %}">Connexion</a>
          {% endif %}
        </nav>
        <main className="hero d-flex align-items-center">
          <section className="container py-5 text-white">
            <p className="text-uppercase fw-semibold mb-3">Menus de la semaine</p>
            <h1 className="display-3 fw-bold col-lg-7">Des idées simples pour chaque repas.</h1>
            <p className="fs-5 col-lg-6 my-4">Générez un menu complet du lundi au dimanche, pour le midi et le soir.</p>
            <a className="btn btn-success btn-lg px-4 py-3" href="/generer/">Commencer</a>
          </section>
        </main>
      </>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Home />);
  </script>
</body>
</html>
