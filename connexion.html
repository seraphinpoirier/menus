<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #f4f7ee; }
    .navbar-brand, h1 { font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    function Login() {
      return <>
        <nav className="navbar bg-white shadow-sm px-4 px-md-5 py-3"><a className="navbar-brand fs-3 fw-bold text-success" href="/">Menus</a></nav>
        <main className="container py-5"><div className="row justify-content-center"><section className="col-12 col-md-8 col-lg-5"><div className="bg-white border shadow-sm p-4 p-md-5"><p className="text-uppercase text-success fw-semibold">Espace personnel</p><h1 className="h2 fw-bold mb-4">Connexion</h1><form onSubmit={(event) => event.preventDefault()}><div className="mb-3"><label className="form-label" htmlFor="email">Adresse e-mail</label><input className="form-control" id="email" type="email" autoComplete="email" /></div><div className="mb-4"><label className="form-label" htmlFor="password">Mot de passe</label><input className="form-control" id="password" type="password" autoComplete="current-password" /></div><button className="btn btn-success w-100" type="submit">Se connecter</button></form><p className="small text-muted mt-4 mb-0">La connexion sera disponible prochainement.</p></div></section></div></main>
      </>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
  </script>
</body>
</html>
